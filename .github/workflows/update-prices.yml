name: Update prices
on:
  schedule:
    - cron: '*/10 1-5 * * 1-5'   # every 10 min, 09:00-13:50 Taiwan time, Mon-Fri
  workflow_dispatch:
  push:
    paths: [codes.txt]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
